services:
  mm-postgres:
    image: postgres:16-alpine
    container_name: mm-postgres
    environment:
      POSTGRES_USER: mm_user
      POSTGRES_PASSWORD: mm_password
      POSTGRES_DB: mm_manage
    ports:
      - "5432:5432"
    volumes:
      - mm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mm_user -d mm_manage"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  mm-postgres-data:
